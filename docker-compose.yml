services:
  neo4j:
    image: neo4j:5-community
    container_name: business-graph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/change-me
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16
    container_name: business-graph-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: business_graph
      POSTGRES_PASSWORD: business_graph
      POSTGRES_DB: business_graph
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: business-graph-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: business-graph-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data

volumes:
  neo4j_data:
  postgres_data:
  minio_data:
