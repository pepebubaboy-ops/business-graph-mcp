[project]
name = "business-graph-mcp"
version = "0.1.0"
description = "File-first business graph core with MCP and OpenAPI adapters."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "neo4j>=5.20",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]
docs = [
  "mkdocs>=1.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["legacy/relation-memory-cowork"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
